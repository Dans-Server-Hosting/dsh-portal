apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-portal
  namespace: dsh-portal
  labels:
    app.kubernetes.io/name: dsh-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        runAsGroup: 10003
      containers:
        - name: portal
          # Built on the node itself (docker build -t dsh-portal:local .);
          # there is no registry, hence Never.
          image: dsh-portal:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: dsh-portal
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: dsh-portal
  namespace: dsh-portal
spec:
  selector:
    app.kubernetes.io/name: dsh-portal
  ports:
    - name: http
      port: 80
      targetPort: http
